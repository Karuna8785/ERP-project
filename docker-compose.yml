version: '3.8'

services:
  smarterp-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarterp_enterprise
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
    volumes:
      - smarterp_data:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  smarterp_data:
    driver: local
